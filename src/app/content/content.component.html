<nav>
  <button (click)="goBack()" title="Go back"><img src="/assets/icons/arrow-back.svg" width="24" height="24" alt="Arrow back"></button>
  <button (click)="share($event)" title="Share page"><img src="/assets/icons/share.svg" width="24" height="24" alt="Share"></button>
  <button (click)="toggle()" title="Toggle TOC">
    <img [src]="showToc ? '/assets/icons/table-off.svg' : '/assets/icons/table.svg'"
        width="24" height="24" alt="TOC">
  </button>
</nav>
<ul [hidden]="!showToc" class="toc"></ul>
<markdown [src]="'/assets/markdown/' + name() + '.md'" (load)="onLoad()" [disableSanitizer]="true"></markdown>
@if (hasAudio) {
  <audio controls playsinline preload="metadata">
    <source src="{{name() | mp3file}}" type="audio/mpeg">
    Your browser does not support audio element
  </audio>
}
@if (hasVideo) {
<video controls playsinline preload="metadata">
  <source src="{{name() | webmfile}}" type='video/webm; codecs="av01.0.12M.08, opus"'>
  <source src="{{name() | mp4file}}" type='video/mp4; codecs="avc1.42c01e, mp4a.40.2"'>
  Your browser does not support video element
</video>
}
<div class="post-navigation">
@if (prevPost) {
  <a [routerLink]="['/', prevPost.name.toLowerCase().split(' ').join('-')]">
    ← {{ prevPost.name }}
  </a>
}

@if (randomPost) {
  <a [routerLink]="['/', randomPost.name.toLowerCase().split(' ').join('-')]">
    Random post
  </a>
}

@if (nextPost) {
  <a [routerLink]="['/', nextPost.name.toLowerCase().split(' ').join('-')]">
    {{ nextPost.name }} →
  </a>
}
</div>

<a href="https://human-made.site/">human-made webring</a>:
<div class="webring">
  <a href="https://human-made.site?prev&referer=https://midzer.de">previous</a> | <a href="https://human-made.site?random&referer=https://midzer.de">random</a> | <a href="https://human-made.site?next&referer=https://midzer.de">next</a>
</div>
